name: Release module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manifest and tests
        env:
          RTS_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("src/right-to-speak/module.json", "utf8")); const tag=process.env.RTS_TAG; if (tag !== `v${m.version}` || !m.download.endsWith(`/releases/download/${tag}/right-to-speak.zip`) || m.manifest !== "https://raw.githubusercontent.com/Jerrvik/right-to-speak/main/src/right-to-speak/module.json") process.exit(1);'
          npm test
          npm run build
          unzip -Z1 dist/right-to-speak.zip | grep -Fx 'right-to-speak/module.json'
          unzip -p dist/right-to-speak.zip right-to-speak/module.json | cmp - src/right-to-speak/module.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_type=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_type+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/right-to-speak.zip src/right-to-speak/module.json --verify-tag --title "Right to Speak $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${release_type[@]}"
